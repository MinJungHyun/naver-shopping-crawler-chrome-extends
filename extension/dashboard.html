<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>네이버 쇼핑 수집기</title><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="panel.css"></head>
<body>
  <header><div class="brand"><span class="logo">N</span><strong>Shopping Collector</strong></div><nav><span id="version" class="version" title="확장 프로그램 버전">v…</span><span class="local">로컬 저장</span><a href="demo.html" target="_blank" rel="noopener" id="demo-link">미리보기 ↗</a><a href="help.html" id="guide-link" aria-label="사용 안내" title="사용 안내">?</a><button id="close-overlay" class="icon-button" aria-label="레이어 닫기" title="레이어 닫기" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></nav></header>
  <main>
    <section class="panel status-panel" aria-label="진행 상태">
      <div class="status-strip"><span id="status" class="pill">준비</span><span id="current" title="현재 검색어">—</span><span id="page" title="진행 페이지">—</span><strong id="count" title="수집한 상품">0<small>개</small></strong><button id="focus" class="icon-button" aria-label="수집 탭 보기" title="수집 탭 보기" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M10 4H4v16h16v-6"/></svg></button></div>
      <div class="status-line"><span id="message" role="status">실행 대기</span><strong id="countdown"></strong><span id="scrolls" title="현재 페이지 스크롤 횟수">스크롤 0회</span></div>
      <div class="progress-track"><div id="progress"></div></div>
    </section>
    <div id="preview" class="notice" hidden>미리보기 · 실제 수집 비활성</div>
    <div id="error" class="error" role="alert" hidden></div>
    <details class="panel server-panel" id="server-panel" open>
      <summary>서버 연결 <span id="server-badge">미설정</span></summary>
      <form id="server-form" novalidate>
        <label for="server-url">서버 주소</label>
        <input id="server-url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://example.trycloudflare.com">
        <label for="server-token">접속 토큰</label>
        <div class="server-token-row"><input id="server-token" type="password" autocomplete="off" spellcheck="false" placeholder="서버에 등록된 토큰 입력"><button id="server-token-toggle" type="button" aria-label="접속 토큰 표시" aria-pressed="false">표시</button></div>
        <p class="server-hint">서버 주소와 토큰으로 로그인합니다. 서버 키워드로 수집하면 결과를 자동 전송합니다.</p>
        <div class="server-actions"><button id="server-connect" type="submit">토큰 로그인</button><button id="server-clear" type="button">설정 삭제</button></div>
        <div class="server-actions"><button id="server-start" type="button">서버 키워드로 수집</button><button id="server-upload" type="button">업로드 재시도</button></div>
        <p id="server-status" class="server-status" role="status">서버 주소와 토큰을 입력하세요.</p>
        <p id="server-extension-id" class="server-extension-id" hidden></p>
      </form>
    </details>
    <section class="panel input-panel" aria-label="수집 설정">
      <div class="keyword-heading"><label for="keywords">JSON 배열</label><span class="keyword-meta"><code>string[]</code><strong id="keyword-count">1개</strong></span></div>
      <textarea id="keywords" spellcheck="false" placeholder='["플래티넘 사료", "강아지 간식"]'>[
  "플래티넘 사료"
]</textarea><p class="hint" id="input-hint" role="status" hidden></p>
      <div class="settings">
        <div class="setting-row"><label for="max-pages">검색 범위</label><select id="max-pages" data-setting="maxPages" aria-label="검색 범위"></select></div>
        <div class="setting-row"><label for="paging-size">페이지당 상품</label><select id="paging-size" data-setting="pagingSize" aria-label="페이지당 상품 수"><option value="40">40개</option><option value="80" selected>80개</option></select></div>
        <div class="setting-row"><label for="cat-id">카테고리 ID</label><input id="cat-id" data-setting="catId" data-kind="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="12" placeholder="선택 · 예: 50000155" aria-label="카테고리 ID"></div>
        <div class="setting-row"><label for="scroll-percent">스크롤 이동량</label><select id="scroll-percent" data-setting="scrollPercent" aria-label="스크롤 이동량"><option value="50">화면의 50%</option><option value="85" selected>화면의 85%</option><option value="100">화면의 100%</option></select></div>
        <div class="setting-row"><span id="action-label">스크롤 · 페이지 대기</span><div class="range"><select id="action-min" data-setting="actionMin" aria-label="스크롤·페이지 최소 대기"></select><span>~</span><select id="action-max" data-setting="actionMax" aria-label="스크롤·페이지 최대 대기"></select><small>무작위</small></div></div>
        <div class="setting-row"><span>다음 검색어 대기</span><div class="range"><select id="keyword-min" data-setting="keywordMin" aria-label="다음 검색어 최소 대기"></select><span>~</span><select id="keyword-max" data-setting="keywordMax" aria-label="다음 검색어 최대 대기"></select><small>무작위</small></div></div>
      </div>
      <div class="controls" aria-label="실행 제어">
        <button class="primary" id="start" aria-label="수집 시작" title="수집 시작"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg><span id="start-label">수집 시작</span></button>
        <button id="pause" class="icon-button" aria-label="일시정지" title="일시정지" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
        <button id="resume" class="icon-button" aria-label="재개" title="재개" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2-5M5 4v5h5"/></svg></button>
        <button id="stop" class="icon-button" aria-label="작업 종료" title="작업 종료" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
      </div>
      <p class="hint" id="block-note" role="status" hidden></p>
      <button id="reset" class="open-preview" hidden><span id="reset-label">작업 초기화</span> <small>종료 + 결과 비우기</small></button>
      <button id="open-preview" class="open-preview">검색 화면만 열기 <small>수집 안 함 ↗</small></button>
    </section>
    <section class="panel results-panel"><div class="section-title"><div class="result-title"><h2>결과</h2><span id="result-count">0개</span></div><div class="export"><button id="csv" disabled>CSV ↓</button><button id="json" disabled>JSON ↓</button><button id="clear" class="text-button" disabled>비우기</button></div></div><div class="filter-row"><input id="filter" aria-label="결과 검색" placeholder="상품 · 업체 · 검색어 필터"><span id="visible-count">최근 200개 표시</span></div><div class="table-wrap"><table><thead><tr><th>상품</th><th>업체</th><th>판매가격</th><th>출처</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty"><strong>수집한 상품이 없습니다.</strong><p>결과가 여기에 표시됩니다.</p></div></div></section>
    <details class="panel logs"><summary>실행 기록 <span id="log-count">0</span></summary><ol id="logs"><li>실행 기록이 없습니다.</li></ol></details>
  </main><script src="core.js"></script><script src="server.js"></script><script src="dashboard.js"></script><script src="server-settings.js"></script>
</body></html>
